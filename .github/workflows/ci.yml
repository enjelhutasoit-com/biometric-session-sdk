name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_16.2.app

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "Missing $XCODE_APP"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Guard Swift version
        run: swift --version 2>&1 | grep -q "Swift version 6.0"
      - name: Lint
        run: ./Scripts/lint.sh
      - name: Concurrency escape hatches
        run: ./Scripts/check-concurrency.sh
      - name: Documentation catalog check
        run: ./Scripts/check-docs.sh
      - name: Threat model check
        run: ./Scripts/check-threat-model.sh
      - name: Examples check
        run: ./Scripts/check-examples.sh
      - name: Public API check
        run: ./Scripts/check-public-api.sh
      - name: Error guide check
        run: ./Scripts/check-errors-doc.sh

  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "Missing $XCODE_APP"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Guard Swift version
        run: swift --version 2>&1 | grep -q "Swift version 6.0"
      - name: Build
        run: swift build
      - name: Test
        run: swift test --skip BiometricSessionPerfTests

  ios-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "Missing $XCODE_APP"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: List schemes and SDKs
        run: |
          xcodebuild -list
          xcodebuild -showsdks
      - name: Build for iOS Simulator (deployment target from Package.swift)
        run: |
          xcodebuild build \
            -scheme BiometricSessionCore \
            -destination 'generic/platform=iOS Simulator'
      - name: Build TestSupport for iOS Simulator
        run: |
          xcodebuild build \
            -scheme BiometricSessionTestSupport \
            -destination 'generic/platform=iOS Simulator'
      - name: Build LocalAuth for iOS Simulator
        run: |
          xcodebuild build \
            -scheme BiometricSessionLocalAuth \
            -destination 'generic/platform=iOS Simulator'
      - name: Build Keychain for iOS Simulator
        run: |
          xcodebuild build \
            -scheme BiometricSessionKeychain \
            -destination 'generic/platform=iOS Simulator'

  ios-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "Missing $XCODE_APP"; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
      - name: List simulators
        run: xcrun simctl list devices available
      - name: Test UIKit adapter on iOS Simulator
        run: |
          xcodebuild test \
            -scheme BiometricSessionUIKit \
            -destination 'platform=iOS Simulator,name=iPhone 16'

  docs:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "Missing $XCODE_APP"; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
      - name: Build documentation
        run: ./Scripts/docbuild.sh

  ios-demo:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "Missing $XCODE_APP"; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
      - name: Build demo for iOS Simulator
        run: |
          xcodebuild build \
            -project Examples/BiometricSessionDemo/BiometricSessionDemo.xcodeproj \
            -scheme BiometricSessionDemo \
            -destination 'generic/platform=iOS Simulator'